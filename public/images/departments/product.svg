<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
    .spark-2{animation-delay:.6s}
    .box{animation:float 2.6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{transform:scale(.8);opacity:.45}50%{transform:scale(1);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
        <g class="box">
