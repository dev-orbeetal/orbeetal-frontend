    <path d="M142 100l-42 22v44l42-22z" fill="#1898d8"/>
    <path d="M100 78l42 22-42 22-42-22z" fill="#f6c453"/>
    <path d="M78 90l44 22" fill="none" stroke="#f3e2a8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path class="spark" d="M156 72h8M160 68v8" stroke="#f5c14d" stroke-width="4" stroke-linecap="round"/>
