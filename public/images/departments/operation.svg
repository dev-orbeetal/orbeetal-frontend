<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .node{transform-box:fill-box;transform-origin:center;animation:node 2s ease-in-out infinite}
    .node-2{animation-delay:.3s}.node-3{animation-delay:.6s}
    .check{transform-box:fill-box;transform-origin:center;animation:pop 2.2s ease-in-out infinite}
    .check-2{animation-delay:.45s}
    @keyframes node{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
    @keyframes pop{0%,100%{transform:scale(.86)}50%{transform:scale(1.12)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
