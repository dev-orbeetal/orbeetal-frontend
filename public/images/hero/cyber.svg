<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title">
<title id="title">Animated cybersecurity shield and connected security services</title>
<defs>
<linearGradient id="shield" x2="1" y2="1"><stop stop-color="#087ebc"/><stop offset=".48" stop-color="#073b70"/><stop offset="1" stop-color="#09baa9"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#00c9ee"/><stop offset=".55" stop-color="#a7e94c"/><stop offset="1" stop-color="#00c9df"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#ccecf5" stop-opacity=".85"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#08c6df"/><stop offset="1" stop-color="#07539d"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#41d5e7" stop-opacity=".35"/><stop offset="1" stop-color="#41d5e7" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#087ca5" flood-opacity=".23"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<g id="tile"><rect x="-57" y="-53" width="114" height="106" rx="27" fill="url(#glass)" stroke="white" stroke-width="2" filter="url(#shadow)"/></g>
<g id="tick"><path d="M0 -18L17 -11V2Q15 15 0 23Q-15 15 -17 2V-11Z" fill="#89d43d" stroke="white" stroke-width="2"/><path d="M-8 1L-2 7L9 -5" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>
<style>
.orbit{transform-origin:320px 310px;animation:spin 24s linear infinite}.data{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}.float{animation:float 4s ease-in-out infinite}.shield-float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="320" cy="310" r="302" fill="url(#halo)"/>
<g fill="none" stroke="#89d6e5" opacity=".45"><circle cx="320" cy="310" r="135"/><circle cx="320" cy="310" r="206"/><circle cx="320" cy="310" r="270"/></g>
<g class="orbit"><circle cx="320" cy="310" r="231" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="110 35 60 35"/><g fill="#b4f65b" filter="url(#glow)"><circle cx="320" cy="79" r="4"/><circle cx="551" cy="310" r="4"/><circle cx="320" cy="541" r="4"/><circle cx="89" cy="310" r="4"/></g></g>
<g class="data" fill="none" stroke="#10b9cb" stroke-width="3" stroke-linecap="round"><path d="M320 310V100M320 310L124 198M320 310L516 198M320 310L124 420M320 310L516 420M320 310V535"/></g>
<ellipse cx="320" cy="432" rx="119" ry="24" fill="#0cbad3" opacity=".18" class="pulse" filter="url(#glow)"/><ellipse cx="320" cy="425" rx="100" ry="20" fill="url(#blue)"/><ellipse cx="320" cy="417" rx="100" ry="20" fill="#d5f6fa" stroke="#fff" stroke-width="2"/><ellipse cx="320" cy="417" rx="78" ry="13" fill="#74d6e5" opacity=".5"/>
<g class="shield-float" filter="url(#shadow)"><path d="M320 186Q369 217 408 226Q418 230 418 242V305Q411 377 320 416Q229 377 222 305V242Q222 230 232 226Q271 217 320 186Z" fill="url(#edge)" stroke="#e0ffff" stroke-width="2"/><path d="M320 202Q365 229 403 239V305Q397 367 320 400Q243 367 237 305V239Q275 229 320 202Z" fill="url(#shield)" stroke="#8feae7" stroke-width="1.5"/><path d="M320 202Q365 229 403 239V305Q397 367 320 400Z" fill="#a4ed46" opacity=".13"/><path d="M295 284V269a25 25 0 0 1 50 0V284" fill="none" stroke="white" stroke-width="11"/><rect x="280" y="280" width="80" height="65" rx="13" fill="url(#glass)" stroke="white"/><circle cx="320" cy="305" r="8" fill="#073b70"/><rect x="316" y="305" width="8" height="19" rx="4" fill="#073b70"/></g>
<g transform="translate(320 85)"><g class="float"><use href="#tile"/><path d="M-28 15A18 18 0 0 1 -31 -20A28 28 0 0 1 22 -22A19 19 0 1 1 30 15Z" fill="url(#blue)"/><use href="#tick" transform="translate(7 9) scale(.8)"/></g></g>
<g transform="translate(115 192)"><g class="float" style="animation-delay:-1s"><use href="#tile"/><rect x="-35" y="-28" width="70" height="48" rx="5" fill="url(#blue)" stroke="#074d82" stroke-width="4"/><path d="M-43 24H43L35 31H-35Z" fill="#07539d"/><use href="#tick" transform="translate(0 -4) scale(.75)"/></g></g>
<g transform="translate(525 192)"><g class="float" style="animation-delay:-2s"><use href="#tile"/><rect x="-37" y="-25" width="74" height="50" rx="7" fill="url(#blue)"/><path d="M-36 -21L0 5L36 -21" fill="none" stroke="white" stroke-width="3"/><use href="#tick" transform="translate(27 19) scale(.8)"/></g></g>
<g transform="translate(115 425)"><g class="float" style="animation-delay:-2.5s"><use href="#tile"/><rect x="-37" y="-25" width="74" height="50" rx="9" fill="url(#blue)"/><rect x="-27" y="-13" width="20" height="15" rx="3" fill="#a9ed49"/><path d="M-27 13H3" stroke="white" stroke-width="4" stroke-linecap="round"/><use href="#tick" transform="translate(28 19) scale(.8)"/></g></g>
<g transform="translate(525 425)"><g class="float" style="animation-delay:-.7s"><use href="#tile"/><rect x="-37" y="-31" width="74" height="62" rx="8" fill="url(#blue)"/><path d="M-36 -17H36" stroke="#7be1ed"/><g fill="#b0ee51"><circle cx="-27" cy="-24" r="2.5"/><circle cx="-18" cy="-24" r="2.5"/><circle cx="-9" cy="-24" r="2.5"/></g><g fill="none" stroke="white" stroke-width="2"><circle cy="7" r="20"/><ellipse cy="7" rx="9" ry="20"/><path d="M-20 7H20M-16 -4H16M-16 18H16"/></g><use href="#tick" transform="translate(26 24) scale(.75)"/></g></g>
<g transform="translate(320 550)"><g class="float" style="animation-delay:-1.7s"><use href="#tile"/><path d="M0 0V-30M0 0L-34 24M0 0L34 24" stroke="#087ebc" stroke-width="5"/><g fill="url(#blue)" stroke="#8be5ed" stroke-width="2"><circle cy="-30" r="9"/><circle cx="-34" cy="24" r="9"/><circle cx="34" cy="24" r="9"/></g><circle r="22" fill="#8bd43c" stroke="white" stroke-width="3"/><path d="M-7 -2V-8a7 7 0 0 1 14 0v6" fill="none" stroke="white" stroke-width="3"/><rect x="-11" y="-2" width="22" height="17" rx="3" fill="white"/><circle cy="5" r="3" fill="#388c50"/></g></g>
</svg>
