<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title">
<title id="title">AI assistant connected to analytics, automation and data systems</title>
<defs>
<linearGradient id="shell" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e3eff7"/><stop offset="1" stop-color="#82b7d0"/></linearGradient>
<linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#d4edf5" stop-opacity=".87"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#23cddd"/><stop offset="1" stop-color="#075494"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#10c9df"/><stop offset="1" stop-color="#a4dc43"/></linearGradient>
<radialGradient id="visor" cx=".5" cy=".8" r=".9"><stop stop-color="#087f92"/><stop offset=".65" stop-color="#073b60"/><stop offset="1" stop-color="#112b46"/></radialGradient>
<radialGradient id="halo"><stop stop-color="#a9e5ed" stop-opacity=".7"/><stop offset="1" stop-color="#bdeaf1" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5ce4ce" stop-opacity="0"/><stop offset="1" stop-color="#77e8c4" stop-opacity=".4"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#175b80" flood-opacity=".17"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.float{animation:float 5s ease-in-out infinite}.a{animation-delay:-1s}.b{animation-delay:-2.7s}.c{animation-delay:-3.8s}.d{animation-delay:-.5s}.flow{stroke-dasharray:5 13;animation:flow 2s linear infinite}.orbit{transform-origin:380px 290px;animation:spin 35s linear infinite}.eye{animation:blink 7s infinite;transform-box:fill-box;transform-origin:center}.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 4s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}@keyframes grow{0%,100%{transform:scaleY(.75)}50%{transform:scaleY(1)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
