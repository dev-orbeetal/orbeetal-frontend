<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Responsive web development</title><desc id="desc">Animated browser dashboard, mobile interface and floating development panels.</desc>
<defs>
<linearGradient id="navy" x2="1" y2="1"><stop stop-color="#1e4660"/><stop offset="1" stop-color="#112240"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="accent" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
<linearGradient id="glass" x2="0.8" y2="1"><stop stop-color="#173056"/><stop offset="1" stop-color="#173056"/></linearGradient>
<linearGradient id="hero" x2="1" y2="1"><stop stop-color="#173056"/><stop offset="1" stop-color="#173056"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="area" x2="0" y2="1"><stop stop-color="#0891b2" stop-opacity=".25"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#22D3EE" flood-opacity=".14"/></filter>
<filter id="small" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#22D3EE" flood-opacity=".14"/></filter>
<style>
.float{animation:float 6s ease-in-out infinite}.phone{animation:float 5s ease-in-out -1.8s infinite}.code{animation:float 7s ease-in-out -3s infinite}.score{animation:float 5.5s ease-in-out -2.5s infinite}.flow{stroke-dasharray:4 10;animation:flow 2s linear infinite}.orbit{transform-origin:380px 310px;animation:spin 38s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.chart{stroke-dasharray:420;animation:chart 6s ease-in-out infinite}.cursor{animation:pulse 1.1s steps(1) infinite}@keyframes float{50%{transform:translateY(-10px)}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes chart{0%{stroke-dashoffset:420}35%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<ellipse cx="380" cy="310" rx="350" ry="290" fill="url(#halo)"/>
<g fill="none" stroke="#a8b8cc" opacity=".55"><circle cx="380" cy="310" r="252" stroke-width="1" stroke-dasharray="3 9"/><circle cx="380" cy="310" r="224" stroke-width="1"/><ellipse cx="380" cy="490" rx="292" ry="65" stroke-width="1.5"/></g>
<g class="orbit"><circle cx="380" cy="58" r="5" fill="#22d3ee"/><circle cx="632" cy="310" r="5" fill="#a3e635"/><circle cx="128" cy="310" r="3" fill="#60a5fa"/></g>
<g fill="none" stroke="#94a3b8" stroke-width="2" opacity=".75" class="flow"><path d="M135 210V115Q135 95 155 95H295"/><path d="M580 180H660V320"/><path d="M180 405V490H330"/><path d="M510 470V530H640"/></g>
<!-- Main browser -->
<g class="float"><g filter="url(#shadow)"><rect x="104" y="108" width="514" height="355" rx="22" fill="url(#glass)" stroke="#22D3EE" stroke-width="2"/><path d="M126 108H596Q618 108 618 130V151H104V130Q104 108 126 108" fill="url(#navy)"/>
<g fill="#c5d0de"><circle cx="125" cy="130" r="4"/><circle cx="139" cy="130" r="4"/></g><circle cx="153" cy="130" r="4" fill="#a3e635"/><rect x="225" y="119" width="268" height="22" rx="11" fill="#112240" opacity=".13"/><path d="M245 128h5v7h-8v-7h3v-3a2.5 2.5 0 015 0" fill="none" stroke="#22D3EE" stroke-width="1.2"/><text x="260" y="134" font-family="system-ui,sans-serif" font-size="10" fill="#E8EEF6">yourbusiness.com</text>
<rect x="122" y="166" width="478" height="279" rx="12" fill="#112240"/><g fill="#E8EEF6"><circle cx="143" cy="185" r="6"/><rect x="154" y="181" width="42" height="7" rx="3"/></g><g fill="#c5d0de"><rect x="365" y="182" width="30" height="5" rx="2"/><rect x="407" y="182" width="30" height="5" rx="2"/><rect x="449" y="182" width="30" height="5" rx="2"/></g><rect x="522" y="176" width="61" height="17" rx="8" fill="#a3e635"/>
<rect x="136" y="205" width="450" height="139" rx="11" fill="url(#hero)"/><rect x="155" y="222" width="56" height="8" rx="4" fill="#0891b2" opacity=".5"/><text x="155" y="256" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#E8EEF6">Build better.</text><text x="155" y="282" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#22D3EE">Grow faster.</text><rect x="156" y="294" width="137" height="5" rx="2.5" fill="#a8b8cc"/><rect x="156" y="305" width="108" height="5" rx="2.5" fill="#c5d0de"/><rect x="156" y="319" width="73" height="15" rx="7.5" fill="#a3e635"/>
<g transform="translate(369 219)"><rect width="191" height="108" rx="11" fill="#112240" stroke="#22D3EE"/><path d="M14 24H177M14 48H177M14 72H177M14 94H177" stroke="#22D3EE" stroke-dasharray="3 4"/><path d="M15 86L40 70L65 76L91 45L116 55L142 29L176 12V94H15Z" fill="url(#area)"/><path class="chart" d="M15 86L40 70L65 76L91 45L116 55L142 29L176 12" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="176" cy="12" r="4" fill="#a3e635" stroke="#081426" stroke-width="2"/></g>
<g><rect x="136" y="358" width="142" height="72" rx="9" fill="#112240"/><rect x="290" y="358" width="142" height="72" rx="9" fill="#112240"/><rect x="444" y="358" width="142" height="72" rx="9" fill="#112240"/><g fill="#60a5fa"><rect x="148" y="369" width="22" height="22" rx="6"/><rect x="302" y="369" width="22" height="22" rx="6" fill="#22d3ee"/><rect x="456" y="369" width="22" height="22" rx="6" fill="#a3e635"/></g><g stroke="#081426" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M153 380l4 4 8-9"/><path d="M307 380h12m-6-6v12"/><path d="M461 384l5-7 3 3 5-6"/></g><g fill="#94a3b8"><rect x="148" y="400" width="98" height="5" rx="2"/><rect x="302" y="400" width="98" height="5" rx="2"/><rect x="456" y="400" width="98" height="5" rx="2"/></g><g fill="#112240"><rect x="148" y="412" width="70" height="4" rx="2"/><rect x="302" y="412" width="70" height="4" rx="2"/><rect x="456" y="412" width="70" height="4" rx="2"/></g></g></g></g>
<!-- Code editor -->
<g class="code"><g filter="url(#small)"><rect x="31" y="262" width="190" height="137" rx="15" fill="url(#navy)" stroke="#0e7490"/><circle cx="47" cy="278" r="3" fill="#a3e635"/><circle cx="57" cy="278" r="3" fill="#60a5fa"/><circle cx="67" cy="278" r="3" fill="#94a3b8"/><text x="82" y="282" fill="#E8EEF6" font-family="monospace" font-size="10">app.tsx</text><path d="M31 291H221" stroke="#0e7490"/><g font-family="monospace" font-size="11"><text x="46" y="310" fill="#E8EEF6">&lt;main&gt;</text><text x="54" y="327" fill="#a3e635">&lt;Responsive /&gt;</text><text x="54" y="344" fill="#60a5fa">&lt;Performance /&gt;</text><text x="54" y="361" fill="#a3e635">&lt;Secure /&gt;</text><text x="46" y="378" fill="#E8EEF6">&lt;/main&gt;</text></g><rect class="cursor" x="103" y="369" width="5" height="11" fill="#a3e635"/></g></g>
<!-- Mobile device -->
<g class="phone"><g filter="url(#shadow)"><rect x="532" y="237" width="148" height="277" rx="26" fill="url(#navy)" stroke="#0e7490" stroke-width="2"/><rect x="539" y="245" width="134" height="261" rx="20" fill="#112240"/><rect x="584" y="251" width="44" height="9" rx="5" fill="#112240"/><circle cx="553" cy="276" r="5" fill="#0e7490"/><rect x="562" y="273" width="37" height="6" rx="3" fill="#112240"/><path d="M650 272h12m-12 4h12m-12 4h12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><rect x="547" y="290" width="118" height="91" rx="10" fill="url(#hero)"/><text x="557" y="314" font-family="system-ui,sans-serif" font-size="14" font-weight="750" fill="#E8EEF6">Build better.</text><text x="557" y="332" font-family="system-ui,sans-serif" font-size="14" font-weight="750" fill="#22D3EE">Grow faster.</text><rect x="558" y="341" width="83" height="4" rx="2" fill="#a8b8cc"/><rect x="558" y="354" width="58" height="14" rx="7" fill="#a3e635"/><rect x="547" y="390" width="118" height="48" rx="8" fill="#112240"/><path d="M556 427l16-9 14 4 17-15 15 5 17-10 19-6" stroke="#60a5fa" stroke-width="2.4" fill="none" stroke-linejoin="round"/><rect x="547" y="446" width="55" height="40" rx="7" fill="#173056"/><rect x="555" y="454" width="28" height="6" rx="3" fill="#60a5fa"/><rect x="610" y="446" width="55" height="40" rx="7" fill="#173056"/><rect x="618" y="454" width="28" height="6" rx="3" fill="#a3e635"/><rect x="583" y="495" width="46" height="4" rx="2" fill="#94a3b8"/></g></g>
<!-- Floating performance tile -->
<g class="score"><g filter="url(#small)"><rect x="493" y="58" width="188" height="89" rx="17" fill="url(#glass)" stroke="#22D3EE" stroke-width="2"/><circle cx="531" cy="102" r="25" fill="#112240"/><circle cx="531" cy="102" r="18" fill="none" stroke="#22D3EE" stroke-width="4"/><circle cx="531" cy="102" r="18" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="98 114" stroke-linecap="round" transform="rotate(-90 531 102)"/><path d="M522 102l6 6 11-13" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="94" fill="#E8EEF6" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Performance</text><text x="566" y="112" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="11">Optimized by design</text><rect x="566" y="122" width="86" height="5" rx="2.5" fill="#112240"/><rect x="566" y="122" width="75" height="5" rx="2.5" fill="url(#accent)"/></g></g>
<!-- Bottom status tile -->
<g class="score" style="animation-delay:-.5s"><g filter="url(#small)"><rect x="194" y="475" width="222" height="55" rx="14" fill="url(#glass)" stroke="#22D3EE" stroke-width="2"/><rect x="207" y="487" width="31" height="31" rx="9" fill="#112240"/><path d="M222 491l10 4v7c0 7-10 11-10 11s-10-4-10-11v-7z" fill="none" stroke="#a3e635" stroke-width="1.7"/><path d="M217 502l3 3 6-7" fill="none" stroke="#a3e635" stroke-width="1.7" stroke-linecap="round"/><text x="248" y="498" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#E8EEF6">Secure &amp; responsive</text><text x="248" y="513" font-family="system-ui,sans-serif" font-size="10" fill="#94A3B8">Built for every screen</text><circle class="pulse" cx="400" cy="493" r="4" fill="#a3e635"/></g></g>
</svg>
